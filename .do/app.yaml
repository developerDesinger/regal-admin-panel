# DigitalOcean App Platform spec for the admin panel.
#
# A service rather than a static site, because the panel must call the API from
# its OWN origin: the admin session cookie is `Secure; SameSite=Strict`, and a
# static host cannot rewrite /api to another host. `server.js` serves the build
# and proxies /api, which is what `vercel.json` does on Vercel.
name: regal-admin-panel
region: nyc
# The custom domain, and NOT optional here: `doctl apps update --spec` replaces
# the whole live spec, so a file without this block silently detaches
# admin.regalapp.net on the next apply. That domain serves the universal-link
# association files Apple and Google fetch, so losing it breaks every
# invitation link in the app, not just the panel's address.
domains:
  - domain: admin.regalapp.net
    type: PRIMARY
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: web
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    # DigitalOcean's GitHub integration, so a push to main deploys itself.
    github:
      repo: developerDesinger/regal-admin-panel
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: node server.js
    health_check:
      http_path: /healthz
    envs:
      # RUN_TIME only. At BUILD time this makes npm skip devDependencies, and
      # the build needs them — `tsc -b` reads @types/node and vite/client, so a
      # production install fails with "Cannot find type definition file".
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Where /api is forwarded. Point this at a custom API domain later if the
      # backend moves off its ondigitalocean.app hostname.
      - key: API_ORIGIN
        scope: RUN_TIME
        value: https://regal-backend-ypkwe.ondigitalocean.app
      # MUST stay empty: the panel calls same-origin /api and `server.js`
      # forwards it. Setting an absolute URL here makes the call cross-site and
      # the session cookie stops being sent.
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ENV
        scope: BUILD_TIME
        value: production
      # Where the iPhone button on /download sends people. A TestFlight beta
      # link for now; swap it for the App Store URL once the app is published
      # and the page relabels itself (`server.js` reads the host to decide).
      # Left unset the button hides itself and the page says "coming soon", so
      # an empty value is safe rather than a dead link.
      - key: IOS_STORE_URL
        scope: RUN_TIME
        value: https://testflight.apple.com/join/StsVaRWQ
