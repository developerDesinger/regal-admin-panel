# Deploy the admin panel to DigitalOcean on every push to main.
#
# App Platform's own "deploy on push" needs DigitalOcean's GitHub integration,
# which is an OAuth grant this account has not made — so the app is wired to a
# plain git clone URL instead, and this workflow is what tells it to pull.
#
# `--wait` is deliberate: without it the job goes green the moment the
# deployment is queued, so a build that fails five minutes later leaves main
# looking healthy while the panel still serves the previous version.
name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# One deploy at a time. Two overlapping pushes would otherwise race, and the
# older build could finish last and win.
concurrency:
  group: do-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger deployment
        run: |
          doctl apps create-deployment "$APP_ID" --wait --format ID,Phase
        env:
          APP_ID: 2201095c-bb49-4b35-9af4-cc8eedca5e6a

      - name: Report the live URL
        run: |
          doctl apps get "$APP_ID" --format DefaultIngress,ActiveDeployment.Phase --no-header
        env:
          APP_ID: 2201095c-bb49-4b35-9af4-cc8eedca5e6a
